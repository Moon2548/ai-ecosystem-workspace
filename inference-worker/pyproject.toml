[project]
name = "inference-worker"
version = "0.1.0"
description = "Inference Worker — โหลดโมเดลจาก MLflow แล้วรัน inference ผ่าน ARQ (Redis Queue)"
requires-python = ">=3.12"
dependencies = [
    "arq>=0.26.0",
    "mlflow>=2.14.0",
    "redis>=5.0.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "minio>=7.2.0",
    "pydantic-settings>=2.6.0",
    "boto3>=1.34.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
