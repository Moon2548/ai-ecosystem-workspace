services:
  redis:
    image: redis:8.0.0-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes | tee /data/redis.log
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 1.b เพิ่ม PostgreSQL Database service
  postgres:
    image: postgres:15
    container_name: postgresql
    restart: unless-stopped
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=labelstudio
    ports:
      - "5433:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data # 1.a ใช้ Volume แยกชื่อ postgresql-data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 2.b เพิ่ม Label Studio service
  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: label-studio
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 2.a เชื่อมต่อใช้งาน Label Studio กับ PostgreSQL
      - DJANGO_DB=default
      - POSTGRE_NAME=labelstudio
      - POSTGRE_USER=myuser
      - POSTGRE_PASSWORD=mypassword
      - POSTGRE_PORT=5432
      - POSTGRE_HOST=postgres
    depends_on:
      - postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 3.b เพิ่ม MinIO service สำหรับ Object Storage
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"      # MinIO API
      - "9001:9001"      # MinIO Console Web UI
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 4. FastAPI Backend — API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://myuser:mypassword@postgres:5432/labelstudio
      - LABEL_STUDIO_URL=http://label-studio:8080
      - LABEL_STUDIO_API_KEY=your-api-key
      - Minio_Endpoint=minio:9000
      - Minio_Access_Key=minioadmin
      - Minio_Secret_Key=minioadmin123
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=change-this-secret-before-production
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_started
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 5. Trainer Worker — ARQ Worker สำหรับเทรนโมเดล
  #    ใช้ Dockerfile เดียวกันกับ backend แต่เปลี่ยน command เป็น ARQ worker
  trainer-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trainer-worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - DATABASE_URL=postgresql+asyncpg://myuser:mypassword@postgres:5432/labelstudio
      - LABEL_STUDIO_URL=http://label-studio:8080
      - LABEL_STUDIO_API_KEY=your-api-key
      - Minio_Endpoint=minio:9000
      - Minio_Access_Key=minioadmin
      - Minio_Secret_Key=minioadmin123
      - JWT_SECRET_KEY=change-this-secret-before-production
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uv run arq core.worker_settings.WorkerSettings
    # หมายเหตุ: สำหรับการใช้งาน GPU ให้เปิด deploy section ด้านล่าง
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 6. MLflow — Experiment Tracking & Model Registry
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    container_name: mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://myuser:mypassword@postgres:5432/labelstudio
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=s3://mlflow/
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_healthy
    # ติดตั้ง psycopg2-binary และ boto3 ก่อน start server
    # (mlflow image ไม่มี psycopg2, boto3, และ curl ติดมาด้วย)
    entrypoint: ["/bin/bash", "-c", "pip install --quiet psycopg2-binary boto3 && mlflow server --backend-store-uri postgresql://myuser:mypassword@postgres:5432/labelstudio --default-artifact-root s3://mlflow/ --host 0.0.0.0 --port 5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 7. Inference Worker — โหลดโมเดลจาก MLflow แล้วรัน inference ผ่าน Redis ARQ
  inference-worker:
    build:
      context: ./inference-worker
      dockerfile: Dockerfile
    container_name: inference-worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MODEL_NAME=bert-base-ner
      - MODEL_STAGE=Production
      - PYTHONUNBUFFERED=1
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    command: uv run python main.py
    # หมายเหตุ: สำหรับการใช้งาน GPU ให้เปิด deploy section ด้านล่าง
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
  postgresql-data: # 1.a กำหนด Volume
  minio-data: # 3.a เพิ่ม Volume สำหรับ MinIO