services:
  redis:
    image: redis:8.0.0-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes | tee /data/redis.log
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 1.b เพิ่ม PostgreSQL Database service
  postgres:
    image: postgres:15
    container_name: postgresql
    restart: unless-stopped
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=labelstudio
    ports:
      - "5433:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data # 1.a ใช้ Volume แยกชื่อ postgresql-data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 2.b เพิ่ม Label Studio service
  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: label-studio
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 2.a เชื่อมต่อใช้งาน Label Studio กับ PostgreSQL
      - DJANGO_DB=default
      - POSTGRE_NAME=labelstudio
      - POSTGRE_USER=myuser
      - POSTGRE_PASSWORD=mypassword
      - POSTGRE_PORT=5432
      - POSTGRE_HOST=postgres
    depends_on:
      - postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 3.b เพิ่ม MinIO service สำหรับ Object Storage
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"      # MinIO API
      - "9001:9001"      # MinIO Console Web UI
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
  postgresql-data: # 1.a กำหนด Volume
  minio-data: # 3.a เพิ่ม Volume สำหรับ MinIO