[project]
name = "backend"
version = "0.1.0"
description = "Feature-driven FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "minio>=7.2.0",
    "pwdlib[argon2]>=0.2.1",
    "pydantic-settings>=2.6.0",
    "python-docx>=1.1.0",
    "PyJWT>=2.10.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.32.0",
    "pymupdf>=1.28.2",
    "arq>=0.26.0",
    "transformers>=4.40.0",
    "datasets>=2.19.0,<3.0.0",
    "torch>=2.2.0",
    "evaluate>=0.4.0",
    "seqeval>=1.2.0",
    "accelerate>=0.30.0",
    "numpy>=1.26.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
